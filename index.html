<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pago seguro | MACVASQUEZ</title>
  <style>
    body{font-family:Inter,Segoe UI,sans-serif;background:#f5f8fc;margin:0;padding:24px;color:#0f172a}
    .card{max-width:760px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,.12)}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}
    .chip{display:inline-block;background:#eef5ff;color:#1d4f75;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
    h1{margin:0 0 4px;font-size:30px}
    p{color:#475569}
    .resume{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
    .box{background:#f8fbff;border:1px solid #d9e5f2;border-radius:18px;padding:14px}
    .box span{display:block;color:#64748b;font-size:12px;margin-bottom:6px}.box strong{font-size:18px}
    .payment-button{display:inline-flex;gap:10px;align-items:center;justify-content:center;width:100%;padding:18px 22px;border-radius:18px;background:linear-gradient(135deg,#ff6b00,#e75a12);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 18px 42px rgba(231,90,18,.28)}
    .payment-button img{height:24px}.error{display:none;color:#b91c1c;background:#fee2e2;border-radius:12px;padding:12px 14px;margin-top:16px}
    @media(max-width:640px){.resume{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <span class="chip">PayPhone</span>
        <h1>Completa tu recarga</h1>
        <p>El saldo se acreditará al usuario indicado una vez que el pago sea aprobado y validado.</p>
      </div>
    </div>

    <div class="resume">
      <div class="box"><span>Usuario</span><strong id="usernameBox">—</strong></div>
      <div class="box"><span>Créditos</span><strong id="creditsBox">—</strong></div>
      <div class="box"><span>Total</span><strong id="totalFinal">—</strong></div>
    </div>

    <div id="botones"></div>
    <div class="error" id="errorText"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const credits = parseInt(urlParams.get('credits') || '0', 10) || 0;
    const amount = parseFloat(urlParams.get('monto') || '0') || 0;
    const email = urlParams.get('email') || '';
    const username = urlParams.get('username') || '';
    const source = urlParams.get('source') || 'macvasquez';

    document.getElementById('usernameBox').textContent = username || email || '—';
    document.getElementById('creditsBox').textContent = String(credits || 0);
    document.getElementById('totalFinal').textContent = '$' + amount.toFixed(2);

    const token = 'Bearer OyVLzij-fpLpyYslzFH3cD86SZieQkMj18D36ibqIA0nYnZUHj3mrmGae-UCGc_5LvAQy-LngYEmi5yRqs9aO2UyQ4CITagKa5ng1rpuWZnx9ksf2Ki4NER_FWY3kxhQcu8tGlxGc6csS-q0R1Cvioe8fiNPcTwZBYHZ-cd0QlJtJRk0M1J4SWHxdSnqZszZ4bATNtB6xdNK93Ak-E8Jrnrv_vhCVMxNpttYue63qdyQq5kAd-vuRLBXAVDAl9f_sb7UtuY8EQRorhW074PRSFgJ7fjSPkY7I_jc9gakIXb1oQuEZ9X9UXPp1OcqS4VEACurCFMdp7eQwHpNe9_NgflubsQ';
    const storeId = 'b9877bb5-16ef-4d29-84d7-f71d6e93b76e';
    const transactionId = Date.now().toString();

    const data = {
      amount: Math.round(amount * 100),
      amountWithoutTax: Math.round(amount * 100),
      amountWithTax: 0,
      tax: 0,
      reference: 'Recarga consultas MACVASQUEZ',
      currency: 'USD',
      clientTransactionId: transactionId,
      storeId: storeId,
      ResponseUrl:
        'https://pagos.macvasquez.com/order-status.html?' +
        new URLSearchParams({
          credits: String(credits),
          email: email,
          username: username,
          source: source,
        }).toString()
    };

    fetch('https://pay.payphonetodoesposible.com/api/button/Prepare', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': token
      },
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(data => {
      const box = document.getElementById('botones');
      if (!data.payWithCard) throw new Error('No se pudo generar el enlace de pago.');
      box.innerHTML = '<a class="payment-button" target="_blank" rel="noopener" href="' + data.payWithCard + '">Pagar ahora con <img src="https://pay.payphonetodoesposible.com/Content/imgv3/payphone-h.svg" alt="PayPhone"></a>';
    })
    .catch(err => {
      const e = document.getElementById('errorText');
      e.style.display = 'block';
      e.textContent = err.message || 'No se pudo preparar el pago.';
    });
  </script>
</body>
</html>
