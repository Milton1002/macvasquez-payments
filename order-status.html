<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gracias por tu compra</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #27ae60;
    }
    .mensaje {
      margin-top: 30px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-volver {
      display: inline-block;
      margin-top: 30px;
      background-color: #2c3e50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #1a252f;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    table th, table td {
      padding: 8px;
      border: 1px solid #ddd;
    }
    table th {
      background-color: #f0f0f0;
    }
    .aviso-correo {
      margin: 25px 0;
      padding: 15px;
      background-color: #e3f7e8;
      border-radius: 8px;
      border-left: 5px solid #27ae60;
    }
  </style>
</head>
<body>
  <h1>✅ ¡Gracias por tu compra!</h1>
  <p>Estamos verificando tu pago...</p>

  <div class="mensaje" id="mensaje"></div>

  <a class="btn-volver" id="btnVolver" href="https://app.macvasquez.com">Volver a consultas</a>

<script>
  function getQueryVariable(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  function clean(value) {
    return String(value || '').trim();
  }

  function parseProductos(productosStr) {
    if (!productosStr) return [];
    return productosStr.split(',').map(item => {
      const [nombre, cantidad, precio] = item.split('|');
      return {
        nombre: decodeURIComponent(nombre || ''),
        cantidad: parseInt(cantidad, 10) || 0,
        precio: parseFloat(precio) || 0
      };
    });
  }

  function deriveCredits(productosStr, creditsValue) {
    const explicit = parseInt(creditsValue, 10) || 0;
    if (explicit > 0) return explicit;

    return parseProductos(productosStr).reduce((acc, item) => {
      const match = clean(item.nombre).match(/\((\d+)\s*(?:consultas?)?\)/i) || clean(item.nombre).match(/(\d+)\s*consultas?/i);
      if (!match) return acc;
      return acc + ((parseInt(match[1], 10) || 0) * (parseInt(item.cantidad, 10) || 1));
    }, 0);
  }

  function buildManualRechargeProducts(creditsValue, amountValue, sourceValue) {
    const creditCount = parseInt(creditsValue, 10) || 0;
    const amountNumber = parseFloat(amountValue) || 0;
    if (creditCount <= 0 || amountNumber <= 0) return '';
    const sourceText = String(sourceValue || '').toLowerCase();
    const productLabel = sourceText.includes('app') ? 'Recarga consultas' : 'Consulta Personas';
    return `${productLabel} (${creditCount})|1|${amountNumber.toFixed(2)}`;
  }

  function extractLicenseCode(scriptResponse) {
    if (!scriptResponse || typeof scriptResponse !== 'object') return '';

    const candidates = [
      scriptResponse.licencia,
      scriptResponse.licenseCode,
      scriptResponse.code,
      scriptResponse.sharedCodeBase,
      scriptResponse.sharedCode,
      scriptResponse.quotaCode,
      scriptResponse.clave,
      scriptResponse.Clave,
      scriptResponse.codigo,
      scriptResponse.Codigo,
      scriptResponse.data && scriptResponse.data.licencia,
      scriptResponse.data && scriptResponse.data.licenseCode,
      scriptResponse.data && scriptResponse.data.code,
      scriptResponse.data && scriptResponse.data.sharedCodeBase,
      scriptResponse.data && scriptResponse.data.sharedCode,
      scriptResponse.data && scriptResponse.data.quotaCode,
      scriptResponse.data && scriptResponse.data.clave,
      scriptResponse.payload && scriptResponse.payload.licencia,
      scriptResponse.payload && scriptResponse.payload.licenseCode,
      scriptResponse.payload && scriptResponse.payload.code,
      scriptResponse.payload && scriptResponse.payload.sharedCodeBase,
      scriptResponse.payload && scriptResponse.payload.sharedCode,
      scriptResponse.payload && scriptResponse.payload.quotaCode,
      scriptResponse.payload && scriptResponse.payload.clave
    ];

    for (const value of candidates) {
      const parsed = clean(value);
      if (parsed) return parsed;
    }

    return '';
  }

  function getReturnDestination(sourceValue) {
    const source = String(sourceValue || '').toLowerCase();
    if (source.includes('app') || source.includes('consulta')) {
      return {
        href: 'https://app.macvasquez.com',
        label: 'Volver a consultas'
      };
    }
    return {
      href: 'https://www.macvasquez.com',
      label: 'Volver al sitio'
    };
  }

  function applyReturnDestination(sourceValue) {
    const button = document.getElementById('btnVolver');
    const destination = getReturnDestination(sourceValue);
    if (!button) return destination;
    button.href = destination.href;
    button.textContent = destination.label;
    return destination;
  }

  function redirectAfterSuccess(sourceValue) {
    const destination = getReturnDestination(sourceValue);
    if (!String(sourceValue || '').toLowerCase().includes('app')) return;
    window.setTimeout(() => {
      window.location.href = destination.href;
    }, 3500);
  }

  function mostrarProductos(productos, container) {
    if (productos.length === 0) return;

    let total = 0;
    let html = `
      <h3>🛒 Productos comprados:</h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th>
          </tr>
        </thead>
        <tbody>
    `;
    productos.forEach(p => {
      const subtotal = p.cantidad * p.precio;
      total += subtotal;
      html += `
        <tr>
          <td>${p.nombre}</td>
          <td>${p.cantidad}</td>
          <td>$${p.precio.toFixed(2)}</td>
          <td>$${subtotal.toFixed(2)}</td>
        </tr>
      `;
    });
    html += `
        </tbody>
        <tfoot>
          <tr>
            <th colspan="3">Total</th><th>$${total.toFixed(2)}</th>
          </tr>
        </tfoot>
      </table>
    `;
    container.innerHTML += html;
  }

  async function enviarAScriptGoogle(payload) {
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbxRivg8xO9HE9UawUvK6ko8fqSWvvs2Caif_l95wHlo8n4CdtRaoiVrjuv8SFxdb9n-3Q/exec';

    try {
      const res = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payload })
      });
      return await res.json();
    } catch (e) {
      const img = document.createElement('img');
      img.src = scriptUrl + '?payload=' + encodeURIComponent(JSON.stringify(payload));
      img.style.display = 'none';
      document.body.appendChild(img);
      return { method: 'GET fallback' };
    }
  }

  async function acreditarQuota(payload, scriptResult) {
    const resolvedLicenseCode = extractLicenseCode(scriptResult);
    const resolvedCredits = deriveCredits(payload.productos || '', payload.credits || '');
    const effectiveCode = resolvedLicenseCode || clean(payload.licenseCode || '') || clean(payload.deviceId || '');

    const response = await fetch('https://api.macvasquez.com/api/payments/credit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: payload.id,
        clientTransactionId: payload.clientTransactionId,
        email: payload.email || '',
        username: payload.username || '',
        source: payload.source || '',
        productos: payload.productos || '',
        credits: resolvedCredits || payload.credits || '',
        licenseCode: effectiveCode || '',
        deviceId: effectiveCode || '',
        originalDeviceId: clean(payload.deviceId || '') || effectiveCode || ''
      })
    });

    return response.json().catch(() => ({ ok: false, error: 'INVALID_JSON' }));
  }

  function notifyParentApproved(payload) {
    const message = {
      type: 'mv-payment-approved',
      payload: payload || {}
    };

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, '*');
      }
    } catch (_) {}

    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, '*');
      }
    } catch (_) {}
  }

  const id = getQueryVariable('id');
  const clientTxId = getQueryVariable('clientTransactionId');
  const productosParam = getQueryVariable('productos');
  const amountParam = getQueryVariable('amount');
  const emailParam = getQueryVariable('email');
  const usernameParam = getQueryVariable('username');
  const deviceIdParam = getQueryVariable('deviceId');
  const creditsParam = getQueryVariable('credits');
  const sourceParam = getQueryVariable('source');
  const licenseCodeParam = getQueryVariable('licenseCode');
  const returnTarget = applyReturnDestination(sourceParam);

  const token = 'Bearer OyVLzij-fpLpyYslzFH3cD86SZieQkMj18D36ibqIA0nYnZUHj3mrmGae-UCGc_5LvAQy-LngYEmi5yRqs9aO2UyQ4CITagKa5ng1rpuWZnx9ksf2Ki4NER_FWY3kxhQcu8tGlxGc6csS-q0R1Cvioe8fiNPcTwZBYHZ-cd0QlJtJRk0M1J4SWHxdSnqZszZ4bATNtB6xdNK93Ak-E8Jrnrv_vhCVMxNpttYue63qdyQq5kAd-vuRLBXAVDAl9f_sb7UtuY8EQRorhW074PRSFgJ7fjSPkY7I_jc9gakIXb1oQuEZ9X9UXPp1OcqS4VEACurCFMdp7eQwHpNe9_NgflubsQ';

  fetch('https://pay.payphonetodoesposible.com/api/button/V2/Confirm', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': token
    },
    body: JSON.stringify({
      id: Number(id),
      clientTxId: clientTxId
    })
  })
    .then(res => res.json())
    .then(async data => {
      const contenedor = document.getElementById('mensaje');

      if (data.transactionStatus === 'Approved') {
        const resolvedEmail = emailParam || data.email || data.optionalParameter2 || '';
        const resolvedProductosParam = productosParam || buildManualRechargeProducts(creditsParam, amountParam || ((parseFloat(data.amount || 0) / 100).toFixed(2)), sourceParam || '');
        const resolvedCredits = deriveCredits(resolvedProductosParam, creditsParam || '');
        const productos = parseProductos(resolvedProductosParam);

        contenedor.innerHTML = `
          <h2 style="color:#27ae60;">✔️ ¡Pago Aprobado!</h2>
          <p>Tu compra fue procesada exitosamente.</p>
          <div class="aviso-correo">
            <p>En unos minutos recibirás un mensaje con tus claves de acceso a: <strong>${resolvedEmail}</strong></p>
            <p>Recuerda revisar tu bandeja de entrada y la carpeta de spam.</p>
            <p>Serás redirigido a <strong>${returnTarget.href.replace('https://', '')}</strong> en unos segundos.</p>
          </div>
        `;

        mostrarProductos(productos, contenedor);

        const payload = {
          id: id,
          clientTransactionId: clientTxId,
          email: resolvedEmail,
          username: usernameParam || '',
          deviceId: deviceIdParam || '',
          licenseCode: licenseCodeParam || '',
          credits: resolvedCredits || creditsParam || '',
          source: sourceParam || '',
          productos: resolvedProductosParam || '',
          transactionDate: new Date().toISOString(),
          payphoneData: data
        };

        let scriptResult = null;
        try {
          scriptResult = await enviarAScriptGoogle(payload);
          console.log('Registrado en Google Sheet:', scriptResult);
        } catch (scriptError) {
          console.error('Error al registrar en Google Sheet:', scriptError);
        }

        let creditResult = null;
        try {
          creditResult = await acreditarQuota(payload, scriptResult || {});
          console.log('Quota acreditada:', creditResult);
        } catch (creditError) {
          console.error('Error al acreditar quota:', creditError);
        }

        const resolvedLicenseCode =
          extractLicenseCode(scriptResult || {}) ||
          clean((creditResult && (creditResult.licenseCode || creditResult.primaryCode)) || '') ||
          clean(licenseCodeParam || '') ||
          clean(deviceIdParam || '');

        notifyParentApproved({
          transactionId: id,
          clientTransactionId: clientTxId,
          email: resolvedEmail,
          username: usernameParam || '',
          deviceId: resolvedLicenseCode || deviceIdParam || '',
          credits: resolvedCredits || creditsParam || '',
          licenseCode: resolvedLicenseCode || '',
          quotaTotal: creditResult && creditResult.quotaTotal ? creditResult.quotaTotal : ''
        });

        redirectAfterSuccess(sourceParam);
      } else {
        contenedor.innerHTML = `
          <h2 style="color:#e74c3c;">❌ Pago No Aprobado</h2>
          <p>Hubo un problema con tu transacción. Por favor intenta nuevamente o contacta con soporte.</p>
        `;
      }

      if (window.history && window.history.replaceState) {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }
    })
    .catch(error => {
      console.error(error);
      document.getElementById('mensaje').innerHTML = `
        <h2 style="color:#e67e22;">⚠️ Error de verificación</h2>
        <p>No se pudo verificar el pago. Intenta nuevamente más tarde.</p>
      `;

      if (window.history && window.history.replaceState) {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }
    });
</script>
</body>
</html>
