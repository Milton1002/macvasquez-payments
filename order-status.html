<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estado del pago | MACVASQUEZ</title>
  <style>
    body{font-family:Inter,Segoe UI,sans-serif;background:#f5f8fc;margin:0;padding:24px;color:#0f172a}
    .card{max-width:760px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,.12)}
    h1{margin-top:0}.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
    .msg{padding:16px;border-radius:16px;background:#f8fbff;border:1px solid #d9e5f2}
    .btn{display:inline-block;margin-top:16px;background:#0f172a;color:#fff;text-decoration:none;padding:12px 18px;border-radius:14px}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Verificando pago…</h1>
    <div class="msg" id="message">Espera mientras validamos tu pago y acreditamos el saldo.</div>
    <a class="btn" href="https://www.macvasquez.com/consultas-en-linea.html">Volver a consultas</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const token = 'Bearer REEMPLAZAR_O_USAR_EL_TOKEN_ACTUAL';
    const proxyBase = 'https://dataflux-proxy.vercel.app';

    function done(cssClass, titleText, bodyText) {
      title.className = cssClass;
      title.textContent = titleText;
      message.textContent = bodyText;
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: cssClass === 'ok' ? 'mv-payment-approved' : 'mv-payment-failed' }, '*'); } catch (_) {}
      try { if (window.opener) window.opener.postMessage({ type: cssClass === 'ok' ? 'mv-payment-approved' : 'mv-payment-failed' }, '*'); } catch (_) {}
    }

    fetch('https://pay.payphonetodoesposible.com/api/button/V2/Confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': token
      },
      body: JSON.stringify({ id: Number(params.get('id')), clientTxId: params.get('clientTransactionId') })
    })
    .then(r => r.json())
    .then(data => {
      if (data.transactionStatus !== 'Approved') {
        done('bad', 'Pago no aprobado', 'La transacción no fue aprobada.');
        return null;
      }
      return fetch(proxyBase + '/api/payments/credit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: Number(params.get('id')),
          clientTransactionId: params.get('clientTransactionId'),
          credits: params.get('credits'),
          email: params.get('email'),
          username: params.get('username')
        })
      }).then(r => r.json());
    })
    .then(data => {
      if (!data) return;
      if (data.ok) {
        done('ok', 'Pago aprobado', 'La recarga fue acreditada correctamente al usuario.');
      } else {
        done('warn', 'Pago aprobado, acreditación pendiente', 'El pago fue confirmado, pero falta revisar la acreditación en el backend.');
      }
    })
    .catch(() => done('warn', 'Verificación pendiente', 'No se pudo completar la validación automática del pago.'));
  </script>
</body>
</html>
